# LlM Integration Workflow v3 - Civic Analytics (OpenAPI-Compatible)

## 🔐 API Proxy Layer Implementation

### 1. OpenAPI Specification (Completed)
```yaml
openapi: 3.0.2
info:
  title: Civic LLMAPI
  version: 1.0.0
paths:
  /llm/generate:
    post:
      summary: Generate civic analysis from natural language queries
      parameters:
        - name: prompt
          in: body
          required: true
          schema:
            type: string
      parameters:
        - name: model
          in: body
          required: true
          schema:
            type: string
          enum: ["llama3:8b", "mistral:7b"]
      parameters:
        - name: max_tokens
          in: body
          required: false
          schema:
            type: integer
          default: 512
      security:
        - ApiKeyAuthorization: ["X-API-Key"]
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        message: { type: string }
        entities: { type: array, items: { $ref: '#/components/schemas/CivicEntity' } }
        timestamp: { type: string, format: date-time }
      required: [message, entities, timestamp]
securitySchemes:
  ApiKeyAuthorization:
    type: apiKey
    in: header
    description: "Bearer-style API key for rate-limited access"
registerScheas:
  civic-entities:
    type: array
    items:
      $ref: '#/components/schemas/CivicEntity'
